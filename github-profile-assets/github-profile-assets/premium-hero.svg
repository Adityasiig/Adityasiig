<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Aditya Ajay Singh</title>
  <desc id="desc">Security Engineer and Telecom DevOps Engineer building secure production systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="0.52" stop-color="#0c0d12"/>
      <stop offset="1" stop-color="#090a0e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="82%" cy="18%" r="65%">
      <stop offset="0" stop-color="#7667ff" stop-opacity=".24"/>
      <stop offset=".48" stop-color="#4d3bd9" stop-opacity=".06"/>
      <stop offset="1" stop-color="#08090c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="8%" cy="100%" r="70%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".13"/>
      <stop offset="1" stop-color="#08090c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset=".52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="438" rx="24"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#bg)" stroke="#292b33" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="440" fill="url(#grid)"/>
    <rect width="1200" height="440" fill="url(#glowA)"/>
    <rect width="1200" height="440" fill="url(#glowB)"/>

    <circle cx="1040" cy="32" r="175" fill="#7c6cff" opacity=".06" filter="url(#blur)"/>
    <circle cx="1037" cy="155" r="113" fill="none" stroke="#8b7cff" stroke-opacity=".14"/>
    <circle cx="1037" cy="155" r="83" fill="none" stroke="#8b7cff" stroke-opacity=".09"/>
    <path d="M954 155h166M1037 72v166" stroke="#8b7cff" stroke-opacity=".1"/>

    <g transform="translate(74 66)">
      <rect width="178" height="32" rx="16" fill="#14161c" stroke="#30323b"/>
      <circle cx="18" cy="16" r="4" fill="#34d399"/>
      <text x="32" y="21" fill="#b8bbc5" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">AVAILABLE TO BUILD</text>
    </g>

    <text x="74" y="190" fill="#f4f4f5" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-2.5">Aditya Ajay Singh</text>
    <rect x="76" y="214" width="520" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="74" y="265" fill="#c7c8ce" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="500">Security Engineer  /  Telecom DevOps</text>
    <text x="74" y="306" fill="#858894" font-family="Segoe UI,Arial,sans-serif" font-size="17">Designing, deploying, observing, and hardening production systems.</text>

    <g transform="translate(74 352)" font-family="Segoe UI,Arial,sans-serif">
      <text x="0" y="0" fill="#696c76" font-size="11" font-weight="600" letter-spacing="1.6">CURRENT FIELD NOTES</text>
      <text x="0" y="32" fill="#d5d6db" font-size="14">OpenSIPS</text>
      <circle cx="82" cy="27" r="2" fill="#555862"/>
      <text x="98" y="32" fill="#d5d6db" font-size="14">FreeSWITCH</text>
      <circle cx="201" cy="27" r="2" fill="#555862"/>
      <text x="217" y="32" fill="#d5d6db" font-size="14">CDR Analytics</text>
      <circle cx="335" cy="27" r="2" fill="#555862"/>
      <text x="351" y="32" fill="#d5d6db" font-size="14">82+ Server Fleet</text>
    </g>

    <g transform="translate(906 118)">
      <path d="M78 0 156 45v90l-78 45L0 135V45Z" fill="#101218" stroke="url(#accent)" stroke-opacity=".8" stroke-width="2"/>
      <path d="M78 30 129 60v60l-51 30-51-30V60Z" fill="none" stroke="#737580" stroke-opacity=".25"/>
      <path d="m51 116 27-76 27 76M62 87h32" fill="none" stroke="#f4f4f5" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="78" cy="180" r="3" fill="#8b7cff"/>
    </g>

ont-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2.2">OPERATE</text><text x="330" y="133" fill="#ededed" font-family="Georgia,Times New Roman,serif" font-size="24">Voice infrastructure</text><text x="330" y="164" fill="#bdbdbd" font-family="Arial,Helvetica,sans-serif" font-size="13" >OpenSIPS / FreeSWITCH</text><path d="M548 80L600 80" stroke="#808080" fill="none" /><path d="M593 76l7 4-7 4" fill="none" stroke="#808080"/><text x="624" y="46" fill="#b0b0b0" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">03</text><text x="624" y="85" fill="#ededed" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2.2">UNDERSTAND</text><text x="624" y="133" fill="#ededed" font-family="Georgia,Times New Roman,serif" font-size="24">CDR &amp; analytics</text><text x="624" y="164" fill="#bdbdbd" font-family="Arial,Helvetica,sans-serif" font-size="13" >Quality / Cost / Margin</text><path d="M842 80L894 80" stroke="#808080" fill="none" /><path d="M887 76l7 4-7 4" fill="none" stroke="#808080"/><text x="918" y="46" fill="#b0b0b0" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">04</text><text x="918" y="85" fill="#ededed" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2.2">DELIVER</text><text x="918" y="133" fill="#ededed" font-family="Georgia,Times New Roman,serif" font-size="24">Customer operations</text><text x="918" y="164" fill="#bdbdbd" font-family="Arial,Helvetica,sans-serif" font-size="13" >Portals / Reports / Tools</text><path d="M36 211L1164 211" stroke="#656565" fill="none" /><text x="36" y="253" fill="#bdbdbd" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2.4">OBSERVE / AUTOMATE / SECURE</text><text x="1164" y="253" fill="#bdbdbd" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="end">Across every layer.</text></svg>
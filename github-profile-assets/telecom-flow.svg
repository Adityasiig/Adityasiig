<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-labelledby="title description">
  <title id="title">Production telecom signal path</title>
  <desc id="description">An animated flow from SIP traffic through OpenSIPS and FreeSWITCH into CDR pipelines and analytics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0a1b2d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="route" d="M122 144H798"/>
  </defs>

  <rect x="1" y="1" width="918" height="258" rx="18" fill="url(#bg)" stroke="#164e63" stroke-width="2"/>
  <text x="32" y="40" fill="#7dd3fc" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2">PRODUCTION SIGNAL PATH</text>
  <text x="32" y="64" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="13">From carrier traffic to operational intelligence</text>

  <path d="M122 144H798" fill="none" stroke="#12334a" stroke-width="8" stroke-linecap="round"/>
  <path d="M122 144H798" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="9 10">
    <animate attributeName="stroke-dashoffset" values="38;0" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(110 144)">
      <circle r="35" fill="#0d2538" stroke="#0ea5e9" stroke-width="2"/>
      <text y="-2" fill="#f8fafc" font-size="13" font-weight="700">SIP</text>
      <text y="15" fill="#94a3b8" font-size="10">TRAFFIC</text>
      <text y="62" fill="#64748b" font-size="11">INGRESS</text>
    </g>
    <g transform="translate(285 144)">
      <circle r="42" fill="#0d2538" stroke="#22d3ee" stroke-width="2"/>
      <text y="4" fill="#f8fafc" font-size="13" font-weight="700">OpenSIPS</text>
      <text y="69" fill="#64748b" font-size="11">ROUTING</text>
    </g>
    <g transform="translate(460 144)">
      <circle r="42" fill="#0d2538" stroke="#38bdf8" stroke-width="2"/>
      <text y="-3" fill="#f8fafc" font-size="12" font-weight="700">FreeSWITCH</text>
      <text y="14" fill="#94a3b8" font-size="9">VOS3000</text>
      <text y="69" fill="#64748b" font-size="11">SOFTSWITCH</text>
    </g>
    <g transform="translate(635 144)">
      <circle r="42" fill="#0d2538" stroke="#60a5fa" stroke-width="2"/>
      <text y="-3" fill="#f8fafc" font-size="13" font-weight="700">CDR</text>
      <text y="14" fill="#94a3b8" font-size="9">KAFKA · DUCKDB</text>
      <text y="69" fill="#64748b" font-size="11">PIPELINE</text>
    </g>
    <g transform="translate(810 144)">
      <circle r="42" fill="#0d2538" stroke="#818cf8" stroke-width="2"/>
      <text y="-3" fill="#f8fafc" font-size="13" font-weight="700">ANALYTICS</text>
      <text y="14" fill="#94a3b8" font-size="9">CLICKHOUSE</text>
      <text y="69" fill="#64748b" font-size="11">GRAFANA</text>
    </g>
  </g>

  <g fill="#e0f2fe" filter="url(#glow)">
    <circle r="4"><animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.5s" begin="-1.15s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.5s" begin="-2.3s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
  </g>
</svg>

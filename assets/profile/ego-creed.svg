<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-label="How I work">
<rect width="1200" height="272" fill="#080706"/>
<rect x="60" y="24" width="1080" height="52" fill="#0c0a09"/>
<rect x="60" y="24" width="2" height="52" fill="#c30010"/>
<text x="84" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#f2f0ed" letter-spacing="0.5" text-anchor="start">I do not guess.</text>
<text x="84" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#4a4642" letter-spacing="0" text-anchor="start">Every claim here was measured before it was written.</text>
<text x="1136" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#1a1715" letter-spacing="0" text-anchor="end">01</text>
<rect x="60" y="86" width="1080" height="52" fill="#080706"/>
<rect x="60" y="86" width="2" height="52" fill="#c30010"/>
<text x="84" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#f2f0ed" letter-spacing="0.5" text-anchor="start">I do not ship blind.</text>
<text x="84" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#4a4642" letter-spacing="0" text-anchor="start">If I have not run it, I do not say it works.</text>
<text x="1136" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#1a1715" letter-spacing="0" text-anchor="end">02</text>
<rect x="60" y="148" width="1080" height="52" fill="#0c0a09"/>
<rect x="60" y="148" width="2" height="52" fill="#c30010"/>
<text x="84" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#f2f0ed" letter-spacing="0.5" text-anchor="start">I do not hide failures.</text>
<text x="84" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#4a4642" letter-spacing="0" text-anchor="start">The broken parts get named, not buried.</text>
<text x="1136" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#1a1715" letter-spacing="0" text-anchor="end">03</text>
<rect x="60" y="210" width="1080" height="52" fill="#080706"/>
<rect x="60" y="210" width="2" height="52" fill="#c30010"/>
<text x="84" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#f2f0ed" letter-spacing="0.5" text-anchor="start">I do not pad.</text>
<text x="84" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#4a4642" letter-spacing="0" text-anchor="start">Fewer moving parts beats a clever architecture.</text>
<text x="1136" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#1a1715" letter-spacing="0" text-anchor="end">04</text>
</svg>